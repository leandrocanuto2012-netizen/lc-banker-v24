<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de ROI — Operação atual x IA x Governança de Dados</title>
<style>
:root{--navy:#14233b;--blue:#2563eb;--bg:#f4f7fb;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--yellow:#facc15;--blueMark:#38bdf8;--green:#65a30d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.005em}
header{background:radial-gradient(circle at 12% 10%,#49315e 0,#1b2945 36%,#102039 100%);color:white;padding:18px 18px;border-bottom:3px solid #b77ac7}
.brandhead{max-width:1180px;margin:auto;display:flex;align-items:center;gap:16px}
.brandlogo{width:82px;height:82px;flex:0 0 82px;object-fit:cover;object-position:center;border-radius:50%;border:2px solid #c68bd4;background:#170f1b;box-shadow:0 0 0 5px #ffffff0d,0 8px 24px #0005}
.brandtext{min-width:0}header h1{font-size:clamp(1.12rem,3vw,1.9rem);line-height:1.22;margin:0 0 8px;letter-spacing:.015em;font-weight:850}header p{margin:0;color:#e8dff1;font-size:.9rem;line-height:1.45}
h2{letter-spacing:.005em;font-weight:800}
.section{box-shadow:0 8px 28px #15213a0b;border-radius:17px}
.field label{font-weight:700}
.field input{transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:#8b5aa1;box-shadow:0 0 0 3px #8b5aa11f}
.tab{transition:background .15s,border-color .15s,transform .15s}
.tab:active,button:active{transform:translateY(1px)}
.metric{box-shadow:0 3px 12px #0f172a06}
@media(max-width:480px){header{padding:13px 12px}.brandhead{gap:11px}.brandlogo{width:62px;height:62px;flex-basis:62px}header h1{font-size:1.03rem}header p{font-size:.76rem}}
main{max-width:1180px;margin:18px auto;padding:0 12px 36px}.section{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin:0 0 15px;box-shadow:0 5px 20px #0f172a08}
h2{font-size:1.05rem;margin:0 0 14px;color:var(--navy)}h3{font-size:.95rem;margin:0 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field label{display:block;font-weight:650;font-size:.86rem;margin-bottom:5px}.field input{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white;color:var(--text)}.field small{display:block;color:var(--muted);font-size:.76rem;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fbfdff;min-width:0}.metric .label{font-size:.78rem;color:var(--muted)}.metric .value{font-size:clamp(1rem,2.2vw,1.3rem);font-weight:800;margin-top:5px;overflow-wrap:anywhere}.metric .sub{font-size:.74rem;color:var(--muted);margin-top:4px}
.metric.yellow{border-top:4px solid var(--yellow)}.metric.blue{border-top:4px solid var(--blueMark)}.metric.green{border-top:4px solid var(--green)}.metric.red{border-top:4px solid var(--red)}
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.compare .metric{background:white}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.secondary{background:#e2e8f0;color:#1e293b}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}.pill{display:inline-block;border-radius:99px;background:#e0f2fe;color:#075985;padding:3px 8px;font-size:.75rem;font-weight:700;margin-bottom:8px}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f8fafc;font-size:.8rem}td:first-child,th:first-child{text-align:left}.positive{color:#047857}.negative{color:#b91c1c}
@media(max-width:760px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.compare{grid-template-columns:1fr}.section{padding:14px}.metric{padding:11px}}
@media print{.tabs,.actions,.diagnostic-launch{display:none}.panel{display:block!important}.section{box-shadow:none;break-inside:avoid}body{background:white}}
.diagnostic-launch{display:flex;align-items:end}.diagnostic-launch button{width:100%;min-height:42px;background:linear-gradient(135deg,#6d3d85,#34204a);box-shadow:0 5px 14px #6d3d8526}.modal{display:none;position:fixed;inset:0;background:#0f172acc;z-index:9999;padding:18px;overflow:auto}.modal.open{display:block}.modal-card{max-width:850px;margin:20px auto;background:white;border-radius:16px;padding:22px;box-shadow:0 20px 70px #0005}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.modal-head h2{margin-bottom:4px}.close-modal{background:#e2e8f0;color:#1e293b}.qblock{border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin:13px 0}.qblock legend{font-weight:800;padding:0 5px}.qblock label{display:block;margin:9px 0;font-weight:500}.qblock input[type=radio],.qblock input[type=checkbox]{margin-right:7px;accent-color:#6d3d85}.qblock input[type=text]{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.diagnosis-result{display:none;border:1px solid #d8b4e2;background:#faf5ff;border-radius:12px;padding:15px;margin-top:14px}.diagnosis-result h3{color:#5b2b72}.diagnosis-result ul{padding-left:20px}@media(max-width:760px){.modal-card{padding:15px;margin:4px auto}.modal{padding:8px}}
